<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000814;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001D3D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGradient)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Inner Gold Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.6"/>
  
  <!-- Bitcoin-style B Symbol -->
  <g transform="translate(256, 256)">
    <!-- Main B shape -->
    <path d="M -60,-80 L 20,-80 C 60,-80 80,-60 80,-30 C 80,-10 70,0 60,10 C 80,20 90,40 90,60 C 90,90 70,110 30,110 L -60,110 Z" 
          fill="url(#goldGradient)" 
          filter="url(#glow)"/>
    
    <!-- B cutouts (holes) -->
    <path d="M -40,-60 L 10,-60 C 30,-60 40,-50 40,-35 C 40,-20 30,-10 10,-10 L -40,-10 Z" 
          fill="#000814"/>
    <path d="M -40,10 L 20,10 C 40,10 50,20 50,40 C 50,60 40,70 20,70 L -40,70 Z" 
          fill="#000814"/>
    
    <!-- Vertical lines through B -->
    <rect x="-20" y="-90" width="8" height="40" fill="url(#goldGradient)" rx="2"/>
    <rect x="10" y="-90" width="8" height="40" fill="url(#goldGradient)" rx="2"/>
    <rect x="-20" y="80" width="8" height="40" fill="url(#goldGradient)" rx="2"/>
    <rect x="10" y="80" width="8" height="40" fill="url(#goldGradient)" rx="2"/>
  </g>
  
  <!-- Decorative Stars -->
  <circle cx="100" cy="100" r="4" fill="#FFD700" opacity="0.8"/>
  <circle cx="412" cy="100" r="4" fill="#FFD700" opacity="0.8"/>
  <circle cx="100" cy="412" r="4" fill="#FFD700" opacity="0.8"/>
  <circle cx="412" cy="412" r="4" fill="#FFD700" opacity="0.8"/>
  
  <!-- Small accent dots -->
  <circle cx="256" cy="60" r="3" fill="#00B4D8" opacity="0.6"/>
  <circle cx="256" cy="452" r="3" fill="#00B4D8" opacity="0.6"/>
  <circle cx="60" cy="256" r="3" fill="#00B4D8" opacity="0.6"/>
  <circle cx="452" cy="256" r="3" fill="#00B4D8" opacity="0.6"/>
</svg>